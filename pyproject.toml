[project]
name = "gtd"
version = "0.1.0"
description = "Personal Getting-Things-Done assistant — Step 1: the stuff inbox"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# Enrichment extras (milestone M2+), not needed for capture
enrich = ["trafilatura", "youtube-transcript-api"]

[project.scripts]
gtd = "gtd.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gtd"]

[tool.setuptools.package-data]
gtd = ["templates/*"]
