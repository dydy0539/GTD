# Pulls new stuff into this inbox every 30 minutes (~1,440 Actions minutes/month,
# inside the 2,000 free minutes private repos get). Run it by hand any time from the Actions tab.
#
# All the logic lives in `gtd run`, so this file never needs to change when features are added.
# Secrets (Settings → Secrets and variables → Actions); each part runs only once its secret exists:
#   GMAIL_ADDRESS, GMAIL_APP_PASSWORD   Gmail (app password from myaccount.google.com/apppasswords)
#   TELEGRAM_BOT_TOKEN                  Telegram bot (token from @BotFather)
#   ANTHROPIC_API_KEY                   optional: read screenshots with Claude
#   GOOGLE_SERVICE_ACCOUNT_JSON,
#   GOOGLE_CALENDAR_ID                  optional: add appointments to Google Calendar automatically
# Optional variable:  TZ  e.g. Asia/Tokyo (used for dates)
name: capture
on:
  # :07 and :37, not :00/:30: GitHub delays or drops scheduled runs at busy on-the-hour times
  schedule: [{cron: "7,37 * * * *"}]
  workflow_dispatch:
concurrency: {group: capture, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GTD_HOME: ${{ github.workspace }}
      TZ: ${{ vars.TZ || 'UTC' }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet "gtd[vision,calendar] @ git+https://github.com/dydy0539/GTD"
      - name: Capture everything
        run: |
          git config user.name "gtd-bot"
          git config user.email "gtd-bot@users.noreply.github.com"
          gtd run --sync
